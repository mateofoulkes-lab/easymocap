<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <title>EasyMocap 2</title>
  <link rel="stylesheet" href="./styles.css?v=0.4.0">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>EasyMocap 2</h1>
      <p>Performance capture por capas</p>
    </div>
    <span class="version">v0.4.0</span>
  </header>

  <main class="shell">
    <section class="card">
      <div class="mode-tabs" role="tablist" aria-label="Modo de captura">
        <button class="mode active" data-mode="body">Body</button>
        <button class="mode" data-mode="face">Face</button>
        <button class="mode" id="viewerButton" type="button">Viewer</button>
      </div>

      <div class="stage">
        <video id="camera" autoplay playsinline muted></video>
        <canvas id="overlay" aria-hidden="true"></canvas>
        <div id="cameraPlaceholder" class="placeholder">Cámara apagada</div>
        <div id="countdown" class="countdown" hidden></div>
      </div>

      <div class="tracking-strip">
        <span id="trackingStatus">Tracking: sin cargar</span>
        <span id="handStatus">Manos: —</span>
      </div>

      <div class="controls">
        <label class="file-button">
          <input id="audioInput" type="file" accept="audio/*">
          <span>Elegir audio</span>
        </label>
        <button id="cameraButton">Encender cámara</button>
      </div>

      <div class="audio-row">
        <audio id="audio" controls preload="metadata"></audio>
        <div id="audioName" class="muted">Sin audio cargado</div>
      </div>

      <button id="recordButton" class="primary" disabled>Grabar actuación</button>
      <button id="downloadButton" hidden>Descargar take JSON</button>
    </section>

    <section class="card status-card">
      <h2>Estado</h2>
      <div id="status" class="status">Inicializando…</div>
      <div id="errorPanel" class="error-panel" hidden>
        <strong>Error</strong>
        <pre id="errorText"></pre>
      </div>
    </section>
  </main>

  <script>document.getElementById("viewerButton").addEventListener("click",()=>location.href="./viewer.html?v=0.4.0");</script>\n  <script type="module" src="./app.js?v=0.4.0"></script>
</body>
</html>
