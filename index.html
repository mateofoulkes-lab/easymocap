<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101216">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./web/styles.css">
  <title>EasyMocap</title>
</head>
<body>
  <main class="app">
    <header>
      <h1>EasyMocap</h1>
      <p>Mocap desde el celular · rig fijo: esqueleto-fase2</p>
      <div id="version" class="version">v0.1.7</div>
    </header>

    <section class="card controls">
      <label class="file">
        <span>Audio</span>
        <input id="audioInput" type="file" accept=".mp3,.ogg,audio/mpeg,audio/ogg">
      </label>
      <div id="audioName" class="muted">Sin audio</div>

      <label class="switchrow">
        <input id="footLock" type="checkbox" checked>
        <span>Fijar pies al suelo (IK)</span>
      </label>
    </section>

    <section class="stage">
      <video id="video" playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div id="countdown" class="countdown hidden"></div>
      <div id="status" class="status">Cámara apagada</div>
    </section>

    <audio id="audio" preload="auto"></audio>

    <section class="actions">
      <button id="cameraBtn" type="button" onclick="window.easyMocapOpenCamera()">Abrir cámara</button>\n      <button id="cameraFacingBtn" type="button" onclick="window.easyMocapToggleFacing()">Usar trasera</button>
      <button id="recordBtn" class="primary" disabled>Grabar</button>
      <button id="downloadBtn" disabled>Guardar take</button>
    </section>

    <section class="card info">
      <strong>Rig precargado</strong>
      <div>esqueleto-fase2.fbx</div>
      <small>El celular graba el movimiento. El take se guarda con el mapeo preparado para este rig.</small>
    </section>
  </main>


  <script>
    window.__easyMocapTapCount = 0;\n    window.__easyMocapFacing = "user";

    window.easyMocapOpenCamera = async function () {
      var tapCount = document.getElementById("tapCount");
      var statusEl = document.getElementById("status");
      var video = document.getElementById("video");
      var cameraBtn = document.getElementById("cameraBtn");

      window.__easyMocapTapCount += 1;
      if (tapCount) tapCount.textContent = String(window.__easyMocapTapCount);
      if (statusEl) statusEl.textContent = "Tap recibido · pidiendo cámara…";

      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          if (statusEl) statusEl.textContent = "getUserMedia no disponible";
          alert("Este navegador no expone navigator.mediaDevices.getUserMedia.");
          return;
        }

        if (window.__easyMocapStream) {
          window.__easyMocapStream.getTracks().forEach(function(t){ t.stop(); });
          window.__easyMocapStream = null;
          if (video) video.srcObject = null;
          if (cameraBtn) cameraBtn.textContent = "Abrir cámara";
          if (statusEl) statusEl.textContent = "Cámara apagada";
          return;
        }

        var stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: window.__easyMocapFacing } },
          audio: false
        });

        window.__easyMocapStream = stream;
        if (video) {
          video.srcObject = stream;
          video.setAttribute("playsinline", "");
          video.muted = true;
          await video.play();
        }
        if (cameraBtn) cameraBtn.textContent = "Cerrar cámara";
        if (statusEl) statusEl.textContent = "● Cámara activa · iniciando tracking…";
        window.dispatchEvent(new CustomEvent("easymocap-camera-ready"));
      } catch (err) {
        var name = err && err.name ? err.name : "Error";
        var msg = err && err.message ? err.message : String(err);
        if (statusEl) statusEl.textContent = "Error cámara: " + name;
        alert("Error al abrir cámara: " + name + "\n\n" + msg);
      }
    };
  </script>

  <script type="module" src="./web/app.js?v=0.1.5"></script>
</body>
</html>
