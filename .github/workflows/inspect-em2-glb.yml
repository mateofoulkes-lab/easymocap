name: Inspect EM2 GLB

on:
  push:
    branches: ["main"]
    paths:
      - "castor_em2.glb"
      - ".github/workflows/inspect-em2-glb.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect castor_em2.glb
        run: |
          python - <<'PY'
          import json, struct
          from pathlib import Path

          p = Path("castor_em2.glb")
          raw = p.read_bytes()
          magic, version, length = struct.unpack_from("<4sII", raw, 0)
          assert magic == b"glTF", magic
          assert version == 2, version
          assert length == len(raw), (length, len(raw))

          off = 12
          chunks = []
          gltf = None
          while off < len(raw):
              chunk_len, chunk_type = struct.unpack_from("<II", raw, off)
              off += 8
              data = raw[off:off+chunk_len]
              off += chunk_len
              chunks.append((chunk_type, chunk_len))
              if chunk_type == 0x4E4F534A:
                  gltf = json.loads(data.decode("utf-8").rstrip(" \t\r\n\x00"))

          assert gltf is not None

          nodes = gltf.get("nodes", [])
          meshes = gltf.get("meshes", [])
          skins = gltf.get("skins", [])
          accessors = gltf.get("accessors", [])

          print("=== GLB BASIC ===")
          print("bytes:", len(raw))
          print("version:", version)
          print("nodes:", len(nodes))
          print("meshes:", len(meshes))
          print("skins:", len(skins))
          print("animations:", len(gltf.get("animations", [])))
          print("materials:", len(gltf.get("materials", [])))

          print("\n=== SKINS / JOINTS ===")
          for i, skin in enumerate(skins):
              names = [nodes[j].get("name", f"<node {j}>") for j in skin.get("joints", [])]
              print(f"skin[{i}] joints={len(names)} skeleton={skin.get('skeleton')}")
              print("  " + ", ".join(names))

          required_bones = [
            "Root","Hips","Spine","Chest","Neck","Head",
            "Shoulder_L","UpperArm_L","LowerArm_L","Hand_L",
            "Shoulder_R","UpperArm_R","LowerArm_R","Hand_R",
            "UpperLeg_L","LowerLeg_L","Foot_L",
            "UpperLeg_R","LowerLeg_R","Foot_R"
          ]
          node_names = {n.get("name") for n in nodes if n.get("name")}
          print("\n=== REQUIRED BONES ===")
          for name in required_bones:
              print(("OK   " if name in node_names else "MISS "), name)

          print("\n=== MESH PRIMITIVES / SKIN ATTRIBUTES ===")
          has_joints = False
          has_weights = False
          morph_names = set()
          for ni, node in enumerate(nodes):
              mi = node.get("mesh")
              if mi is None: continue
              mesh = meshes[mi]
              print(f"node[{ni}] {node.get('name')} mesh[{mi}] {mesh.get('name')} skin={node.get('skin')}")
              extras = mesh.get("extras", {})
              tn = extras.get("targetNames", [])
              for n in tn: morph_names.add(n)
              if tn: print("  targetNames:", ", ".join(tn))
              for pi, prim in enumerate(mesh.get("primitives", [])):
                  attrs = prim.get("attributes", {})
                  print(f"  prim[{pi}] attrs={sorted(attrs.keys())} targets={len(prim.get('targets', []))}")
                  has_joints |= "JOINTS_0" in attrs
                  has_weights |= "WEIGHTS_0" in attrs

          print("\nJOINTS_0 present:", has_joints)
          print("WEIGHTS_0 present:", has_weights)

          required_morphs = [
            "EM2_Blink_L","EM2_Blink_R",
            "EM2_BrowDown_L","EM2_BrowUp_L","EM2_BrowDown_R","EM2_BrowUp_R",
            "EM2_MouthOpen","EM2_MouthNarrow","EM2_MouthWide",
            "EM2_MouthFrown_L","EM2_MouthSmile_L","EM2_MouthFrown_R","EM2_MouthSmile_R",
            "EM2_HandOpen_L","EM2_IndexOpen_L","EM2_HandOpen_R","EM2_IndexOpen_R"
          ]
          print("\n=== REQUIRED MORPHS ===")
          for name in required_morphs:
              print(("OK   " if name in morph_names else "MISS "), name)

          print("\n=== NODE SUMMARY ===")
          for i,n in enumerate(nodes):
              if n.get("name"):
                  flags=[]
                  if "mesh" in n: flags.append(f"mesh={n['mesh']}")
                  if "skin" in n: flags.append(f"skin={n['skin']}")
                  if n.get("children"): flags.append(f"children={len(n['children'])}")
                  print(f"{i:03d} {n['name']} {' '.join(flags)}")
          PY

# inspection workflow active
