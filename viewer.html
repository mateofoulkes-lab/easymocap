<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111318"><title>EasyMocap 2 Viewer</title>
  <link rel="stylesheet" href="./viewer.css?v=0.5.7">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}</script>
</head>
<body>
  <header class="topbar"><div><h1>EasyMocap 2 · Viewer</h1><p>Validación y playback</p></div><div class="head-actions"><a href="./index.html?v=0.5.7">Recorder</a><span>v0.5.7</span></div></header>
  <main class="layout">
    <section class="viewer-card"><div id="viewport"></div><div class="transport"><button id="playButton" disabled>▶ Play</button><input id="scrub" type="range" min="0" max="1" value="0" step="0.001" disabled><span id="timeLabel">0.00 / 0.00</span></div><audio id="audio" preload="metadata"></audio></section>
    <aside class="panel">
      <h2>Sesión</h2><div id="sessionStatus" class="summary">Buscando captura reciente…</div><button id="clearSessionButton" disabled>Borrar sesión temporal</button><h2>Archivos</h2>
      <label>Modelo GLB <small>(castor_em2 cargado por defecto)</small><input id="modelInput" type="file" accept=".glb,model/gltf-binary"></label>
      <label>Body take<input id="bodyInput" type="file" accept=".json,application/json"></label>
      <label>Face take<input id="faceInput" type="file" accept=".json,application/json"></label>
      <label>Audio <small>(opcional)</small><input id="audioInput" type="file" accept="audio/*"></label>
      <h2>Validación</h2><div id="summary" class="summary">Cargando modelo…</div><div id="validation" class="validation"></div>
      <div id="errorPanel" class="error-panel" hidden><strong>Error</strong><pre id="errorText"></pre></div>
    </aside>
  </main>
  <script type="module" src="./viewer.js?v=0.5.7"></script>
</body>
</html>
